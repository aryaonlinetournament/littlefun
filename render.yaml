services:
  - type: web
    name: littlefun-backend
    env: node
    rootDir: backend
    # 'standard' plan = always-on, no sleep after inactivity
    # 'starter' plan sleeps after 15 min → cold starts ruin UX
    plan: standard
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    # Health check — Render pings this to keep the server alive
    healthCheckPath: /health
    autoDeploy: true
    # Render will restart if health check fails for 3 consecutive checks
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FIREBASE_PROJECT_ID
        value: littlefunwithpartner
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPER_ADMIN_UID
        value: FkCSTRi6JBSfBf2haCnj8yCoOiC2
      - key: SUPER_ADMIN_EMAIL
        value: aryaonlinetournament@gmail.com
      - key: ALLOWED_ORIGINS
        value: https://littlefunwithpartner.web.app,http://localhost:5173,http://localhost:5174

  # Self-ping cron — extra insurance against any sleep behavior
  # Runs every 10 minutes to keep the server warm
  - type: cron
    name: littlefun-keepalive
    env: node
    rootDir: backend
    plan: starter
    schedule: "*/10 * * * *"
    buildCommand: npm install --include=dev && npm run build
    startCommand: node -e "fetch(process.env.BACKEND_URL + '/health').then(r => r.json()).then(d => console.log('✅ Keepalive ping:', d.status)).catch(e => console.error('❌ Ping failed:', e.message))"
    envVars:
      - key: BACKEND_URL
        value: https://littlefun.onrender.com

